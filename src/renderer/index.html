<div id="app" class="app">

  <!-- 顶栏（无边框拖动区） -->
  <header class="topbar" id="winBar">
    <div class="brand" title="拖拽此区域可移动窗口">
      <span class="logo" id="appLogo"><img src="assets/emblem.jpg" alt="残火纪徽记"></span>
      <div class="brand-text">
        <b>KP 跑团工作台</b>
        <span class="sub" id="appSub">残火纪 · 烬中寻火</span>
      </div>
    </div>
    <div class="top-actions">
      <span class="profile-chip" id="topProfile" title="当前 AI 人设">—</span>
      <select id="themeSelect" title="主题皮肤"></select>
      <button class="ghost" id="btnDensity" title="切换卡片密度：紧凑 / 舒适" onclick="WB.toggleDensity()"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-rows"></use></svg>密度</button>
      <button class="ghost" id="btnGmMode" title="开团模式（F2）：一屏聚合 当前幕 / 待兑现伏笔 / 遭遇战 / 快捷骰 / 常用收藏" onclick="WB.toggleGmMode()"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-bolt"></use></svg><span id="gmBtnLabel">开团</span></button>
      <button class="ghost" id="btnQuickNote" title="随手便签（Ctrl+Shift+N）：任意界面记一句，团后一键归档为 日志 / 伏笔 / NPC" onclick="WB.openQuickNote()"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-pen"></use></svg>便签</button>
      <button class="ghost" id="btnBackup" title="立即备份"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-db"></use></svg>备份</button>
      <button class="ghost" id="btnFolder" title="打开数据文件夹"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-folder"></use></svg>文件夹</button>
    </div>
    <div class="win-ctl" id="winCtl">
      <button class="wc" id="wcMin" title="最小化"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-min"></use></svg></button>
      <button class="wc" id="wcMax" title="最大化/还原"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-max"></use></svg></button>
      <button class="wc wc-close" id="wcClose" title="关闭"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-close"></use></svg></button>
    </div>
  </header>

  <div class="body">
    <!-- 侧栏 -->
    <nav class="sidebar" id="sidebar">
      <div class="gsearch" title="Ctrl+K 呼出命令面板">
        <span class="gf"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-search"></use></svg></span><input id="glSearch" placeholder="全局搜索 (Ctrl+K)…" oninput="WB.globalSearch(this.value)">
      </div>
      <!-- 总览：独立大板块 -->
      <div class="sect">总 览</div>
      <button data-view="dash" class="nav active"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-overview"></use></svg><span class="navt">总览看板</span></button>
      <div class="sep"></div>

      <!-- 工作台功能 -->
      <details class="snav" data-grp="work"><summary><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-toolbox"></use></svg><span class="navt">工作台功能</span></summary>
        <button data-view="pcs" class="nav"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-person"></use></svg><span class="navt">人物卡</span><span class="navc" data-nc="pcs"></span></button>
        <button data-view="npcs" class="nav"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-hood"></use></svg><span class="navt">NPC 图鉴</span><span class="navc" data-nc="npcs"></span></button>
        <button data-view="regions" class="nav"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-peaks"></use></svg><span class="navt">地区场景</span><span class="navc" data-nc="regions"></span></button>
        <button data-view="logs" class="nav"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-book"></use></svg><span class="navt">战役日志</span><span class="navc" data-nc="logs"></span></button>
        <button data-view="mobs" class="nav"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-skull"></use></svg><span class="navt">怪物图鉴</span><span class="navc" data-nc="mobs"></span></button>
        <button data-view="rules" class="nav"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-doc"></use></svg><span class="navt">规则速查</span><span class="navc" data-nc="rules"></span></button>
        <button data-view="lore" class="nav"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-castle"></use></svg><span class="navt">背景城设</span><span class="navc" data-nc="lore"></span></button>
        <button data-view="relations" class="nav"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-network"></use></svg><span class="navt">关系网</span></button>
        <button data-view="tags" class="nav"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-tag"></use></svg><span class="navt">标签</span></button>
        <button data-view="maps" class="nav"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-map"></use></svg><span class="navt">地图</span></button>
        <button data-view="encounter" class="nav"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-bolt"></use></svg><span class="navt">临场战斗</span></button>
        <button data-view="stats" class="nav"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-chart"></use></svg><span class="navt">统计分析</span></button>
      </details>

      <!-- 工作台 AI 功能 -->
      <details class="snav" data-grp="workai"><summary><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-sparkle"></use></svg><span class="navt">工作台 AI 功能</span></summary>
        <button data-view="ai" class="nav"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-sparkle"></use></svg><span class="navt">AI 助手</span></button>
        <button data-view="persona" class="nav"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-mask"></use></svg><span class="navt">AI 设定</span></button>
        <button data-view="aiconf" class="nav"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-sliders"></use></svg><span class="navt">AI 配置</span></button>
        <button data-view="polish" class="nav"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-pen"></use></svg><span class="navt">记录润色</span></button>
        <button data-view="rawtext" class="nav"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-lines"></use></svg><span class="navt">原始文本</span></button>
      </details>

      <!-- 骰娘功能 -->
      <details class="snav" data-grp="dice"><summary><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-d20"></use></svg><span class="navt">骰娘功能</span></summary>
        <button data-view="dicehost" class="nav"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-link"></use></svg><span class="navt">连 QQ 骰娘</span></button>
        <button data-view="dice" class="nav"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-die"></use></svg><span class="navt">本地掷骰</span></button>
        <button data-view="dicework" class="nav"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-compass"></use></svg><span class="navt">骰娘工作台</span></button>
      </details>

      <!-- 骰娘 AI 设置 -->
      <details class="snav" data-grp="diceai"><summary><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-cpu"></use></svg><span class="navt">骰娘 AI 设置</span></summary>
        <button data-view="diceai" class="nav"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-toggle"></use></svg><span class="navt">AI 功能开关</span></button>
        <button data-view="diceaichat" class="nav"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-bubbles"></use></svg><span class="navt">群聊 AI 行为</span></button>
        <button data-view="dicememe" class="nav"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-picture"></use></svg><span class="navt">表情包库</span></button>
      </details>

      <!-- 设置 -->
      <details class="snav" data-grp="sys"><summary><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-gear"></use></svg><span class="navt">设置</span></summary>
        <button data-view="settings" class="nav"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-gear"></use></svg><span class="navt">偏好设置</span></button>
        <button data-view="datasteward" class="nav"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-db"></use></svg><span class="navt">数据管家</span></button>
        <button data-view="help" class="nav"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-help"></use></svg><span class="navt">帮助中心</span></button>
        <button data-view="changelog" class="nav"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-megaphone"></use></svg><span class="navt">更新公告</span></button>
        <button data-view="runlog" class="nav"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-clock"></use></svg><span class="navt">运行记录</span></button>
      </details>
      <div class="sep"></div>
      <button id="btnChatToggle" class="nav" title="展开/收起侧栏 AI 对话"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-chat"></use></svg><span class="navt">AI 对话</span></button>
      <button id="btnSidebarToggle" class="nav" title="折叠/展开侧栏"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-collapse"></use></svg><span class="navt">折叠侧栏</span></button>
    </nav>

    <!-- 主内容 -->
    <main class="content" id="content"><div class="empty loading">加载中…</div></main>

    <!-- 侧栏常驻 AI 对话抽屉 -->
    <aside class="chatdrawer" id="chatdrawer" hidden>
      <div class="chathead">
        <span>AI 对话</span>
        <span class="cd-profile" id="drawerProfile">人设 · 未配置</span>
        <button id="btnChatClose" title="收起">»</button>
      </div>
      <div class="chatdrawer-bar">
        <select id="drawerGenType" title="选择建卡类型"><option value="npc">NPC</option><option value="pc">人物卡</option><option value="region">地区</option><option value="log">日志</option><option value="mob">怪物</option></select>
        <button id="drawerGenBuild" title="结合上方对话生成该类型资料卡">⚡按对话建卡</button>
        <button id="drawerImportLast" title="把最近一条 AI 回复拆解为资料卡">⇥建资料卡</button>
        <button id="drawerPlot" title="从近期对话与日志提炼剧情要点，一键写入长期记忆">☉ 要点</button>
        <button id="drawerSuggest" title="从近期会话/日志提炼 NPC 与剧情点建议，预览确认后写入工作台">☷ 剧情</button>
        <button id="drawerScriptBtn" title="展开/收起「剧本解析」：粘贴剧本一键拆解为多类资料卡（已并入侧栏）">✎剧本</button>
      </div>
      <!-- 剧本解析（并入侧栏） -->
      <div id="drawerScriptPanel" class="drawer-script" hidden>
        <textarea id="drawerScriptText" class="autoarea" rows="3" placeholder="在此粘贴跑团剧本正文…（或点下方「导入文件」读取 txt / md / docx / pdf / xlsx）"></textarea>
        <div class="chatdrawer-bar">
          <button id="drawerScriptImport" title="导入剧本文件文本类文件">📄文件</button>
          <button id="drawerScriptParse" title="把上方剧本一键拆解为人物/NPC/地区/日志/怪物，预览勾选后写入">⇄解析剧本</button>
          <span class="hint" id="drawerScriptState"></span>
        </div>
      </div>
      <div class="chatlog" id="drawerLog"></div>
      <div class="chatinput">
        <button id="drawerUpload" title="添加文字文件为附件（AI 无识图，仅文本）；添加后可附额外要求再发送">📎</button>
        <div id="pendFiles" class="pend-slot" hidden></div>
        <textarea id="drawerIn" class="autoarea" maxlength="60000" rows="1" placeholder="向 AI 提问…（Enter 发送 / Shift+Enter 换行）"></textarea>
        <button id="drawerExport" title="导出最近 AI 回复为 .txt">⬇</button>
        <button id="drawerSend" title="发送">发送</button>
      </div>
    </aside>
  </div>

  <!-- 底部状态条：骰娘连接 / 档案 / 备份 / 版本 -->
  <footer class="statusbar" id="statusBar">
    <span class="sb-item" id="sbDice"><span class="sb-dot off"></span>骰娘未连接</span>
    <span class="sb-item sb-dim" id="sbDiceCh">—</span>
    <span class="sb-sp"></span>
    <span class="sb-item sb-dim" id="sbArchive">档案：—</span>
    <span class="sb-item" id="sbBackup">尚未备份</span>
    <span class="sb-item sb-dim" id="sbTheme">主题：现代卷宗</span>
    <span class="sb-item sb-dim" id="sbVersion">v—</span>
  </footer>

</div>

<!-- 通用弹窗 -->
<div class="modal-mask" id="modalMask" hidden>
  <div class="modal" id="modalBox"></div>
</div>

<!-- 确认框 -->
<div class="modal-mask" id="confirmMask" hidden>
  <div class="modal small" id="confirmBox"></div>
</div>

<!-- Ctrl+K 命令面板 -->
<div class="palette-mask" id="paletteMask" hidden>
  <div class="palette" id="paletteBox">
    <div class="pal-input"><span class="pp"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-search"></use></svg></span><input id="palIn" placeholder="输入要跳转的页面 / 资料…（↑↓ 选择 Enter 打开 Esc 关闭）"></div>
    <div class="pal-list" id="palList"></div>
  </div>
</div>

<!-- Ctrl+Shift+F 全局快速搜索 -->
<div class="palette-mask gsearch-mask" id="gSearchMask" hidden>
  <div class="palette gsearch-box" id="gSearchBox">
    <div class="pal-input"><span class="pp"><svg class="ic" aria-hidden="true" focusable="false"><use href="#i-search"></use></svg></span><input id="gSearchIn" placeholder="全局搜索：资料 / 人物 / 关系 / 地图 / 记忆 / 原始文本…（↑↓ 选择 Enter 跳转 Esc 关闭）"></div>
    <div class="pal-list" id="gSearchList"></div>
  </div>
</div>

<!-- 新手引导 -->
<div class="modal-mask" id="onboardMask" hidden>
  <div class="modal" id="onboardBox"></div>
</div>

<!-- U0-3 全局随手便签（Ctrl+Shift+N / 顶栏「便签」） -->
<div class="modal-mask" id="noteMask" hidden>
  <div class="modal note-modal" id="noteBox">
    <h3>随手便签</h3>
    <div class="note">任意界面随时记一句；团后点右侧按钮一键归档为「日志 / 伏笔 / NPC」。Ctrl+Enter 记下，Esc 关闭。</div>
    <textarea id="noteInput" rows="3" placeholder="例：老陈的怀表停在 3:07 —— 可能是时间线关键线索。"></textarea>
    <div class="foot">
      <button class="ghost" onclick="WB.closeQuickNote()">关闭</button>
      <span class="grow"></span>
      <button class="ghost" onclick="WB.quickNoteArchiveAll()" title="把所有便签一次性归档为日志（状态：待跟进）">全部→日志</button>
      <button onclick="WB.quickNoteAdd()">记下</button>
    </div>
    <div id="noteList" class="note-list"></div>
  </div>
</div>

<!-- 全局「AI 处理中」提示：任意界面调用 AI 时显示，提示勿重复点击 -->
<div class="ai-busy" id="aiBusy" hidden>
  <span class="ai-busy-spin"></span>
  <b id="aiBusyText">AI 处理中</b>
  <span class="ai-busy-tip">请勿重复点击，完成后自动关闭</span>
  <button class="ghost small" id="aiBusyCancel" onclick="WB.aiCancelCurrent()" title="中止正在进行的 AI 任务，任务类型错误会被终止">✕ 取消任务</button>
  <button class="ghost small" id="aiQueueClear" hidden onclick="WB.aiAbortAll()" title="清空所有排队任务并中止当前任务">清空排队</button>
  <div class="ai-queue" id="aiQueue" hidden></div>
</div>

<div class="toasts" id="toasts"></div>

<!-- 文件拖拽导入遮罩反馈 -->
<div class="drop-overlay" id="dropOverlay" hidden><div class="drop-box">松开以导入文件</div></div>

<script src="dice-ui/conn-center.js"></script>
<script src="dice-ui/conn-log.js"></script>
<script src="dice-ui/reply-editor.js"></script>
<script src="dice-ui/sim-chat.js"></script>
<script src="dice-ui/workshop.js"></script>
<script src="dice-ui/wizard.js"></script>
<script src="app.js"></script>
<!-- 视图模块：加载期只注册工厂，由 app.js 在 DOMContentLoaded 时以共享上下文 KPViews 水合 -->
<script src="views/changelog.js"></script>
</body>
</html>
